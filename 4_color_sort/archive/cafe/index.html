<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4c294">
<title>Café Sort · Lezzet katları</title>
<link rel="icon" href="assets/cafe-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="cafe-scene" aria-hidden="true"></div>
<main id="app">
  <header class="brand-bar">
    <div class="brand">Lezzet <em>Katları</em></div>
    <div class="wallet" aria-label="Altın"><span class="coin-icon">✦</span><b id="earned">0</b></div>
    <button id="btnSound" class="icon-btn" aria-label="Sesi kapat" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4V4Zm4 4c2 2 2 6 0 8m3-11c4 4 4 10 0 14"/></svg></button>
  </header>
  <section id="top" aria-label="Bölüm durumu">
    <button id="btnLevels" class="icon-btn" aria-label="Bölümler"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
    <div class="lvl"><small>MUTFAĞINDA YENİ BİR GÜN</small><div><span id="lvlNum">Bölüm 1</span><span id="lvlTag" class="tag"></span></div></div>
    <div id="hearts" aria-label="Kalan can"></div>
    <span id="freezeTag" role="status"></span>
    <button id="btnRestart" class="icon-btn" aria-label="Bölümü yeniden başlat"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
  </section>
  <section id="orderPanel" aria-label="Siparişler">
    <div class="section-heading"><span><i class="live-dot"></i> Bugünün siparişleri</span><span id="served">0 / 4 hazır</span></div>
    <div class="tickets"></div>
    <div class="order-progress"><i id="orderProgress"></i></div>
  </section>
  <section id="stage" aria-label="Dört sefer tası ve iki masa">
    <div id="boardFrame"><div id="board" role="group" aria-label="Ürünü seç, sonra hedef masaya veya sefer tasına dokun"></div></div>
  </section>
  <div class="hint-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6m-5 3h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2Z"/></svg><div id="hint" role="status" aria-live="polite"></div></div>
  <footer id="boosters" aria-label="Yardımcılar">
    <button class="booster" data-b="space"><span class="booster-art"><svg viewBox="0 0 40 40"><path d="m5 18 15-8 15 8-15 8Z"/><path d="M5 18v9l15 8 15-8v-9M20 26v9M20 9V2m-4 4h8"/></svg></span><span>Ek yer</span><b class="cnt"></b></button>
    <button class="booster" data-b="freeze"><span class="booster-art"><svg viewBox="0 0 40 40"><path d="M20 3v34M5 11l30 18M5 29l30-18M14 6l6 6 6-6M14 34l6-6 6 6M5 18l8-2-2-8M29 32l-2-8 8-2M5 22l8 2-2 8M29 8l-2 8 8 2"/></svg></span><span>Süreyi dondur</span><b class="cnt"></b></button>
    <button class="booster" data-b="swap"><span class="booster-art"><svg viewBox="0 0 40 40"><path d="M6 14h28l-7-7M34 26H6l7 7"/><circle cx="10" cy="26" r="4"/><circle cx="30" cy="14" r="4"/></svg></span><span>Yer değiştir</span><b class="cnt"></b></button>
  </footer>
  <div class="footer-note">KARIŞTIR. EŞLEŞTİR. MUTLU ET.</div>
</main>
<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-label="Oyun menüsü"><div class="card" id="card"></div></div>
<script src="items.js"></script>
<script src="menus.js"></script>
<script src="levels.js"></script>
<script src="game.js"></script>
</body>
</html>
