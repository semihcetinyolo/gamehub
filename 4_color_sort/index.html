<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>4 Color Sort</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btnSettings" class="icon-btn" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>
    </button>
    <div class="lvl" aria-live="polite"><span class="eyebrow">SEVİYE</span><span id="lvlNum">1</span><span id="lvlTag" class="tag"></span>
      <span class="moves"><b id="moves">0</b><small id="par">hedef 5</small></span></div>
    <div class="right">
      <button id="btnUndo" class="icon-btn" aria-label="Geri al">
        <svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 1 1 0 10h-2"/></svg>
      </button>
      <button id="btnRestart" class="icon-btn" aria-label="Yeniden başlat">
        <svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg>
      </button>
    </div>
    <button id="btnLevels" hidden aria-label="Bölüm seçimi"></button>
  </header>

  <section id="stage">
    <div id="frame"><div id="board"></div></div>
  </section>

  <div id="hint">Taşları kaydır, karttaki deseni oluştur</div>
</div>

<div id="overlay" class="hidden"><div class="card-pop" id="pop"></div></div>

<script src="art.js"></script>
<script src="features.js"></script>
<script src="levels.js"></script>
<script src="admin.js"></script>
<script src="game.js"></script>
</body>
</html>
