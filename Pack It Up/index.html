<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pack It Up!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{width:100%;height:100%;overflow:hidden;background:#1a1a2e;}
body{width:390px;height:844px;margin:0 auto;overflow:hidden;font-family:'Nunito','Arial Rounded MT Bold',sans-serif;user-select:none;touch-action:none;background:#1a1a2e;}
#scr{position:relative;width:390px;height:844px;overflow:hidden;}
#bg{position:absolute;inset:0;z-index:0;}
/* HEADER */
#hdr{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 14px 0;pointer-events:none;}
.pill{font-size:.7rem;font-weight:900;letter-spacing:1.5px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.3);padding:5px 12px;border-radius:20px;backdrop-filter:blur(8px);pointer-events:auto;}
#htitle{font-size:1.05rem;font-weight:900;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.35);}
/* BAG */
#bag-area{position:absolute;left:0;right:0;z-index:10;display:flex;flex-direction:column;align-items:center;}
/* GRID */
#grid-wrap{position:relative;}
#grid{display:grid;position:relative;z-index:1;}
.gc{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.13);border-radius:4px;transition:background .15s,border-color .15s;}
.gc.filled{background:rgba(0,0,0,.38);border-color:rgba(0,0,0,.18);}
.on-base .gc{background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);}
.on-base .gc.filled{background:rgba(0,0,0,.26);border-color:rgba(0,0,0,.16);box-shadow:inset 0 2px 6px rgba(0,0,0,.3);}
.bare .gc{background:rgba(80,55,30,.2);border:2px solid rgba(70,45,20,.22);border-radius:9px;box-shadow:inset 0 3px 7px rgba(0,0,0,.28);}
.bare .gc.filled{background:rgba(50,32,16,.34);border-color:rgba(50,32,16,.3);}
.gc.ok{background:rgba(90,230,130,.55)!important;border-color:rgba(40,200,100,.95)!important;box-shadow:inset 0 0 0 3px rgba(40,200,100,.5)!important;}
.gc.no{background:rgba(255,90,90,.5)!important;border-color:rgba(230,60,60,.9)!important;box-shadow:none!important;}
/* PLACED */
#placed-layer{position:absolute;top:0;left:0;pointer-events:none;z-index:4;}
#snap-shadow{position:absolute;pointer-events:none;z-index:2;border-radius:10px;opacity:0;transition:opacity .12s;}
.pi{position:absolute;cursor:grab;pointer-events:auto;border-radius:8px;overflow:hidden;}
.pi.fresh{animation:pop .24s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes pop{from{transform:scale(.7);opacity:.3}to{transform:scale(1);opacity:1}}
/* SCATTER */
#scatter{position:absolute;inset:0;pointer-events:none;z-index:20;}
#global-placed{position:absolute;inset:0;pointer-events:none;z-index:12;}
.si{position:absolute;cursor:grab;touch-action:none;filter:drop-shadow(0 11px 13px rgba(0,0,0,.45));will-change:transform;}
.si.drag{opacity:.12;}
/* GHOST */
#ghost{position:fixed;pointer-events:none;z-index:9000;display:none;transform-origin:center center;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));}
/* SUITCASE */
.sc-handle-wrap{position:relative;width:100%;display:flex;justify-content:center;align-items:flex-end;}
.sc-handle-arc{position:absolute;top:4px;border:8px solid currentColor;border-bottom:none;border-radius:18px 18px 0 0;width:78px;height:26px;}
.sc-post{position:absolute;bottom:0;width:10px;border-radius:5px 5px 0 0;}
.sc-body{position:relative;}
.sc-corner{position:absolute;width:20px;height:20px;border-radius:6px;}
.sc-corner.tl{top:7px;left:7px}.sc-corner.tr{top:7px;right:7px}
.sc-corner.bl{bottom:8px;left:7px}.sc-corner.br{bottom:8px;right:7px}
.sc-stripe{position:absolute;top:0;bottom:0;width:10px;}
.sc-stripe.l{left:4px;border-radius:5px}.sc-stripe.r{right:4px;border-radius:5px}
.sc-latch{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);width:32px;height:16px;border-radius:6px;border:2px solid rgba(0,0,0,.2);}
.sc-latch::after{content:'';position:absolute;top:3px;left:50%;transform:translateX(-50%);width:12px;height:7px;background:rgba(0,0,0,.18);border-radius:3px;}
.sc-wheels{position:relative;width:100%;height:18px;}
.sc-wheel{position:absolute;bottom:2px;width:26px;height:14px;border-radius:7px;box-shadow:0 3px 6px rgba(0,0,0,.4);}
.sc-wheel.l{left:18px}.sc-wheel.r{right:18px}
.sc-wheel::after{content:'';position:absolute;inset:3px;border-radius:50%;border:2px solid rgba(0,0,0,.25);}
/* BACKPACK */
.bp-wrap{position:relative;}
.bp-strap{position:absolute;width:16px;border-radius:8px;top:-8px;bottom:-20px;}
.bp-strap.l{left:20px}.bp-strap.r{right:20px}
.bp-top-grip{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:52px;height:14px;border:6px solid rgba(0,0,0,.28);border-bottom:none;border-radius:10px 10px 0 0;}
.bp-body{position:relative;}
.bp-opening{position:absolute;left:-3px;right:-3px;top:-10px;height:16px;border-radius:10px 10px 0 0;}
.bp-pocket{position:absolute;left:14px;right:14px;border:3px solid rgba(0,0,0,.18);border-radius:12px;background:rgba(0,0,0,.06);}
.bp-pocket-zip{position:absolute;top:-2px;left:8px;right:8px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;}
/* MAKEUP BAG */
.mk-wrap{position:relative;}
.mk-body{position:relative;}
.mk-zip-open{position:absolute;left:0;right:0;top:-16px;height:20px;display:flex;align-items:center;justify-content:center;}
.mk-zip-l,.mk-zip-r{flex:1;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.5) 0,rgba(255,255,255,.5) 4px,transparent 4px,transparent 8px);}
.mk-zip-pull{width:12px;height:24px;border-radius:6px;background:linear-gradient(180deg,#e0e0e0,#9e9e9e);box-shadow:0 2px 5px rgba(0,0,0,.3);margin:0 4px;flex-shrink:0;}
.mk-top-rim{position:absolute;left:-2px;right:-2px;top:-6px;height:12px;border-radius:6px 6px 0 0;opacity:.6;}
/* LINING */
.grid-lining{position:absolute;top:0;left:0;background:rgba(0,0,0,.22);border-radius:10px;box-shadow:inset 0 3px 12px rgba(0,0,0,.4);pointer-events:none;z-index:0;}
/* WIN / INTRO */
#win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(14px);z-index:8000;align-items:center;justify-content:center;}
#win.show{display:flex;}
#win-card{background:#fff;border-radius:30px;padding:36px;text-align:center;width:300px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:crdIn .4s cubic-bezier(.175,.885,.32,1.275) both;}
@keyframes crdIn{from{transform:scale(.5) translateY(40px);opacity:0}to{transform:scale(1);opacity:1}}
#w-em{font-size:4rem;display:block;margin-bottom:6px}#w-st{font-size:1.7rem;letter-spacing:4px;margin-bottom:8px}
#w-ti{font-size:1.65rem;font-weight:900;color:#222;margin-bottom:6px}#w-de{color:#888;font-size:.85rem;margin-bottom:22px;line-height:1.5}
#w-btn{background:linear-gradient(135deg,#ff9f43,#ee5a24);color:#fff;border:none;padding:13px 32px;font-family:inherit;font-size:.9rem;font-weight:900;border-radius:50px;cursor:pointer;box-shadow:0 5px 0 #c0392b;}
#w-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c0392b;}
#intro{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(16px);z-index:7000;align-items:center;justify-content:center;cursor:pointer;}
#intro.show{display:flex;}
#intro-card{background:#fff;border-radius:30px;padding:38px 34px;text-align:center;width:300px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:crdIn .4s cubic-bezier(.175,.885,.32,1.275) both;}
#i-em{font-size:3.6rem;display:block;margin-bottom:8px}#i-ti{font-size:1.5rem;font-weight:900;color:#222;margin-bottom:6px}
#i-su{color:#888;font-size:.84rem;line-height:1.5}#i-tap{margin-top:14px;font-size:.72rem;font-weight:700;color:#ccc;}
.cf{position:fixed;pointer-events:none;z-index:7999;border-radius:3px;animation:cfFall linear forwards;}
@keyframes cfFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}85%{opacity:1}100%{transform:translateY(105vh) rotate(700deg);opacity:0}}
/* SKIP LEVEL (dev control, anchored to viewport top-right, outside the phone frame) */
#skip-btn{position:fixed;top:16px;right:16px;z-index:9500;
  background:rgba(0,0,0,.6);color:#fff;border:none;
  font-family:inherit;font-weight:800;font-size:.78rem;letter-spacing:.5px;
  padding:10px 16px;border-radius:24px;cursor:pointer;
  box-shadow:0 4px 14px rgba(0,0,0,.3);backdrop-filter:blur(6px);}
#skip-btn:active{transform:translateY(1px);}
</style>
</head>
<body>
<div id="scr">

  <div id="hdr">
    <div class="pill" id="h-lv">LEVEL 1</div>

  <div id="scatter"></div>

<div id="ghost"></div>

</div></div>
<div id="intro"><div id="intro-card">

</div></div>

/* ── CONSTANTS & STATE ── */
const W=390,H=844,BBORDER=3,SS=0.9;
let lvl,grid,items,CELL=56,baseLay=null,curIdx=0;
let BPAD_H=24,BPAD_V=10;
let GBODYW=W,GBORDER=BBORDER; // suitcase body width + wall thickness (thin for slim levels)
let gridOffX=0,gridOffY=0; // grid position relative to #scr
let dragItem=null,dox=0,doy=0;
const ghost=document.getElementById('ghost');

/* ── HELPERS ── */
function mkEl(t='div',c=''){const d=document.createElement(t);if(c)d.className=c;return d;}
function vbox(s){const m=s.match(/viewBox="0 0 ([0-9.]+) ([0-9.]+)"/);return m?[+m[1],+m[2]]:[1,1];}
/* Grid footprint [cols,rows] for an item — from PNG dims or SVG viewBox */
function dimOf(item){return item.img?[item.w,item.h]:vbox(SVG[item.key]);}
/* Art markup — <img> for asset pieces, inline SVG otherwise */
function artHTML(item){return item.img?`<img src="${item.img}" draggable="false">`:SVG[item.key];}
/* Inject + size art into a host element */
function injectArt(host,item,wPx,hPx){
  host.innerHTML=artHTML(item);
  const ch=host.querySelector('svg,img');
  if(item.img&&item.art){
    // place the art exactly as authored over its footprint (offset+size in cells), allow overflow
    const cell=wPx/item.w, a=item.art;
    host.style.overflow='visible';
    ch.style.cssText=`position:absolute;left:${a.dx*cell}px;top:${a.dy*cell}px;width:${a.iw*cell}px;height:${a.ih*cell}px;display:block;`;
  }else{
    ch.style.cssText=`width:${wPx}px;height:${hPx}px;display:block;`+(item.img?'object-fit:contain;':'');
  }
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hrgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function lighten(hex,p){if(!hex.startsWith('#'))return hex;const[r,g,b]=hrgb(hex),f=p/100;return`rgb(${clamp(~~(r+(255-r)*f),0,255)},${clamp(~~(g+(255-g)*f),0,255)},${clamp(~~(b+(255-b)*f),0,255)})`;}
function darken(hex,p){if(!hex.startsWith('#'))return hex;const[r,g,b]=hrgb(hex),f=p/100;return`rgb(${clamp(~~(r*(1-f)),0,255)},${clamp(~~(g*(1-f)),0,255)},${clamp(~~(b*(1-f)),0,255)})`;}

/* ── INIT ── */
function initLevel(idx){
  curIdx=idx;
  lvl=LEVELS[idx];
  if(lvl.bareGrid){
    // Bare board defined by a 0/1 active map (from map generator); sized like level 1.
    CELL=Math.min(Math.floor((W-48)/lvl.cols),Math.floor((H-120)/lvl.rows));
  }else if(lvl.baseImg){
    // Custom portrait suitcase image: fit fully on-screen (small margin); grid fills its front face.
    const f=lvl.face,M=8,VM=8;
    const scale=Math.min((W-2*M)/lvl.baseW,(H-2*VM)/lvl.baseH);
    const artW=Math.round(lvl.baseW*scale),artH=Math.round(lvl.baseH*scale);
    const faceW=(f.r-f.l)*artW,faceH=(f.b-f.t)*artH;
    CELL=Math.floor(Math.min(faceW/lvl.cols,faceH/lvl.rows));
    BPAD_V=8;
    baseLay={artW,artH,baseLeft:Math.round((W-artW)/2),baseTop:Math.round((H-artH)/2)};
  }else if(lvl.slim){
    // Thin-walled suitcase, centered with a small side margin → maximal grid.
    // Wall thickness varies by art style but pad compensates so grid size stays identical.
    GBODYW=W-2*14;
    const fr=lvl.frame||'glossy';
    GBORDER = fr==='outline'?8 : fr==='soft'?3 : 2;
    BPAD_V=10-GBORDER;
    CELL=Math.floor((GBODYW-GBORDER*2-2*BPAD_V)/lvl.cols);
  }else{
    GBODYW=W; GBORDER=BBORDER; BPAD_V=10; CELL=56;
  }
  BPAD_H=Math.floor((GBODYW-GBORDER*2-lvl.cols*CELL)/2);
  grid=Array.from({length:lvl.rows},()=>Array(lvl.cols).fill(null));
  if(lvl.gridMap){ // mark inactive (hole) cells as blocked so pieces can't be placed there
    for(let r=0;r<lvl.rows;r++)for(let c=0;c<lvl.cols;c++) if(!lvl.gridMap[r][c]) grid[r][c]='X';
  }
  items=lvl.items.map((d,i)=>{
    let cells=d.cells;
    if(!cells&&d.w){cells=[];for(let r=0;r<d.h;r++)for(let c=0;c<d.w;c++)cells.push([r,c]);}
    return{id:i,key:d.key,img:d.img,art:d.art,w:d.w,h:d.h,cells,placed:false,row:0,col:0,sx:0,sy:0,srot:0,el:null};
  });
  document.getElementById('bg').style.background=lvl.bg;
  document.getElementById('h-lv').textContent=`LEVEL ${idx+1}`;
  document.getElementById('global-placed').innerHTML='';
  buildBag();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    // cache grid offset for placed-layer positioning
    const scr=document.getElementById('scr').getBoundingClientRect();
    const gr=document.getElementById('grid').getBoundingClientRect();
    gridOffX=gr.left-scr.left; gridOffY=gr.top-scr.top;
    buildScatter();updateProg();showIntro();
  }));
}

/* ── BAG BUILD (custom portrait suitcase image) ── */
function buildBagBase(){
  const area=document.getElementById('bag-area');
  area.innerHTML=''; area.style.top='0px';
  const {artW,artH,baseLeft,baseTop}=baseLay, f=lvl.face;
  const img=mkEl('img'); img.src=lvl.baseImg; img.draggable=false;
  img.style.cssText=`position:absolute;left:${baseLeft}px;top:${baseTop}px;width:${artW}px;height:${artH}px;pointer-events:none;`;
  area.appendChild(img);
  const faceL=baseLeft+f.l*artW, faceT=baseTop+f.t*artH;
  const faceW=(f.r-f.l)*artW, faceH=(f.b-f.t)*artH;
  const gridW=lvl.cols*CELL, gridH=lvl.rows*CELL;
  const gx=Math.round(faceL+(faceW-gridW)/2), gy=Math.round(faceT+(faceH-gridH)/2);
  const gw=mkEl('div');gw.id='grid-wrap';gw.style.cssText=`position:absolute;left:${gx}px;top:${gy}px;`;
  const g=mkEl('div');g.id='grid';g.className='on-base';
  g.style.cssText=`display:grid;position:relative;z-index:1;
    grid-template-columns:repeat(${lvl.cols},${CELL}px);grid-template-rows:repeat(${lvl.rows},${CELL}px);`;
  for(let r=0;r<lvl.rows;r++)for(let c=0;c<lvl.cols;c++){const d=mkEl('div','gc');d.dataset.r=r;d.dataset.c=c;g.appendChild(d);}
  gw.appendChild(g);
  const ss=mkEl('div');ss.id='snap-shadow';gw.appendChild(ss);
  area.appendChild(gw);
}

/* ── BARE BOARD (active-cell grid from map generator, no suitcase) ── */
function buildBagGrid(){
  const area=document.getElementById('bag-area');
  area.innerHTML=''; area.style.top='0px';
  const gridW=lvl.cols*CELL, gridH=lvl.rows*CELL;
  const gx=Math.round((W-gridW)/2), gy=Math.round((H-gridH)/2);
  const gw=mkEl('div');gw.id='grid-wrap';gw.style.cssText=`position:absolute;left:${gx}px;top:${gy}px;`;
  const g=mkEl('div');g.id='grid';g.className='bare';
  g.style.cssText=`display:grid;position:relative;z-index:1;
    grid-template-columns:repeat(${lvl.cols},${CELL}px);grid-template-rows:repeat(${lvl.rows},${CELL}px);`;
  for(let r=0;r<lvl.rows;r++)for(let c=0;c<lvl.cols;c++){
    if(lvl.gridMap[r][c]){const d=mkEl('div','gc');d.dataset.r=r;d.dataset.c=c;d.style.gridRow=(r+1);d.style.gridColumn=(c+1);g.appendChild(d);}
  }
  gw.appendChild(g);
  const ss=mkEl('div');ss.id='snap-shadow';gw.appendChild(ss);
  area.appendChild(gw);
}

/* ── BAG BUILD ── */
function buildBag(){
  if(lvl.bareGrid)return buildBagGrid();
  if(lvl.baseImg)return buildBagBase();
  const area=document.getElementById('bag-area');
  area.innerHTML='';
  const bc=lvl.bagColor,dk=darken(bc,24),bd=lvl.borderColor||dk;
  const fr=lvl.frame||'glossy';
  const gridH=lvl.rows*CELL;
  const bodyH=gridH+BPAD_V*2+GBORDER*2;
  const bgGrad=fr==='outline'
    ? `linear-gradient(160deg,${lighten(bc,12)} 0%,${bc} 72%)`
    : `linear-gradient(155deg,${lighten(bc,20)} 0%,${bc} 100%)`;
  const bodyInset=fr==='soft'?'inset 0 1px 0 rgba(255,255,255,.12)'
    :fr==='outline'?'inset 0 0 0 2px rgba(255,255,255,.14)'
    :'inset 0 2px 0 rgba(255,255,255,.18)';

  // compute centered top
  let extraTop=0,extraBottom=0;
  if(lvl.bagType==='suitcase'){extraTop=38;extraBottom=18;}
  else if(lvl.bagType==='backpack'){extraTop=22;}
  else{extraTop=18;}
  const totalH=extraTop+bodyH+extraBottom;
  const bagTop=Math.max(44,Math.floor((H-totalH)/2));
  area.style.top=bagTop+'px';

  if(lvl.bagType==='suitcase'){
    // Handle
    const hw=mkEl('div','sc-handle-wrap');
    hw.style.cssText=`width:${GBODYW}px;height:${extraTop}px;position:relative;`;
    const arc=mkEl('div','sc-handle-arc');
    arc.style.cssText=`border-color:${lvl.handleColor};left:50%;transform:translateX(-50%);`;
    const pl=mkEl('div','sc-post');
    pl.style.cssText=`background:${lvl.handleColor};left:calc(50% - 30px);height:28px;bottom:0;`;
    const pr=mkEl('div','sc-post');
    pr.style.cssText=`background:${lvl.handleColor};right:calc(50% - 30px);height:28px;bottom:0;`;
    hw.appendChild(arc);hw.appendChild(pl);hw.appendChild(pr);
    area.appendChild(hw);

    const body=mkEl('div','sc-body');
    body.style.cssText=`width:${GBODYW}px;height:${bodyH}px;background:${bgGrad};
      border:${GBORDER}px solid ${bd};border-radius:${fr==='outline'?16:20}px;position:relative;
      box-shadow:0 8px 0 ${darken(bc,36)},0 14px 28px rgba(0,0,0,.38),${bodyInset};`;
    if(!lvl.slim){ // thin-walled levels skip the side straps/latch/corners so the grid stays maximal
      const sl=mkEl('div','sc-stripe l');sl.style.background=darken(bc,16);body.appendChild(sl);
      const sr=mkEl('div','sc-stripe r');sr.style.background=darken(bc,16);body.appendChild(sr);
      const latch=mkEl('div','sc-latch');latch.style.background=lighten(bc,30);body.appendChild(latch);
      ['tl','tr','bl','br'].forEach(p=>{const c=mkEl('div','sc-corner '+p);c.style.background=`linear-gradient(135deg,rgba(255,255,255,.35),rgba(0,0,0,.18))`;body.appendChild(c);});
    }
    injectGrid(body);area.appendChild(body);

    const wb=mkEl('div','sc-wheels');
    wb.style.cssText=`width:${GBODYW}px;height:${extraBottom}px;position:relative;`;
    const ax=mkEl('div');ax.style.cssText=`position:absolute;left:22px;right:22px;top:3px;height:5px;background:${darken(bc,30)};border-radius:3px;`;
    const wl=mkEl('div','sc-wheel l');wl.style.background=`linear-gradient(180deg,#555,#222)`;
    const wr2=mkEl('div','sc-wheel r');wr2.style.background=`linear-gradient(180deg,#555,#222)`;
    wb.appendChild(ax);wb.appendChild(wl);wb.appendChild(wr2);area.appendChild(wb);

  }else if(lvl.bagType==='backpack'){
    const wrap=mkEl('div','bp-wrap');
    wrap.style.cssText=`width:${W}px;position:relative;margin-top:${extraTop}px;`;

    const strapColor=darken(bc,28);
    const sl=mkEl('div','bp-strap l');sl.style.background=strapColor;wrap.appendChild(sl);
    const sr=mkEl('div','bp-strap r');sr.style.background=strapColor;wrap.appendChild(sr);
    const grip=mkEl('div','bp-top-grip');grip.style.borderColor=darken(bc,32);wrap.appendChild(grip);

    const body=mkEl('div','bp-body');
    body.style.cssText=`width:${W}px;height:${bodyH}px;background:${bgGrad};
      border:${BBORDER}px solid ${dk};border-radius:16px 16px 24px 24px;position:relative;
      box-shadow:0 8px 0 ${darken(bc,36)},0 14px 28px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.18);`;

    // Opening rim at top (shows bag is open)
    const rim=mkEl('div','bp-opening');
    rim.style.background=darken(bc,18);body.appendChild(rim);

    // Front pocket at bottom
    const pkt=mkEl('div','bp-pocket');
    pkt.style.cssText+=`bottom:12px;height:${~~(bodyH*.2)}px;`;
    const pzip=mkEl('div','bp-pocket-zip');pkt.appendChild(pzip);
    body.appendChild(pkt);

    injectGrid(body);wrap.appendChild(body);area.appendChild(wrap);

  }else{ // makeup
    const wrap=mkEl('div','mk-wrap');
    wrap.style.cssText=`width:${W}px;position:relative;margin-top:${extraTop}px;`;

    // Open zipper visual
    const zipRow=mkEl('div','mk-zip-open');
    const zl=mkEl('div','mk-zip-l');
    const pull=mkEl('div','mk-zip-pull');
    const zr=mkEl('div','mk-zip-r');
    zipRow.appendChild(zl);zipRow.appendChild(pull);zipRow.appendChild(zr);
    wrap.appendChild(zipRow);

    const body=mkEl('div','mk-body');
    body.style.cssText=`width:${W}px;height:${bodyH}px;background:${bgGrad};
      border:${BBORDER}px solid ${dk};border-radius:20px;position:relative;
      box-shadow:0 8px 0 ${darken(bc,36)},0 14px 28px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.18);`;

    const rim=mkEl('div','mk-top-rim');
    rim.style.background=lighten(bc,15);body.appendChild(rim);

    injectGrid(body);wrap.appendChild(body);area.appendChild(wrap);
  }
}

function injectGrid(body){
  const gw=mkEl('div');gw.id='grid-wrap';
  gw.style.cssText=`position:absolute;top:${BPAD_V}px;left:${BPAD_H+GBORDER}px;`;

  const lining=mkEl('div','grid-lining');
  lining.style.cssText+=`width:${lvl.cols*CELL}px;height:${lvl.rows*CELL}px;`;
  gw.appendChild(lining);

  const g=mkEl('div');g.id='grid';
  g.style.cssText=`display:grid;position:relative;z-index:1;
    grid-template-columns:repeat(${lvl.cols},${CELL}px);
    grid-template-rows:repeat(${lvl.rows},${CELL}px);`;
  for(let r=0;r<lvl.rows;r++)
    for(let c=0;c<lvl.cols;c++){
      const d=mkEl('div','gc');d.dataset.r=r;d.dataset.c=c;g.appendChild(d);
    }
  gw.appendChild(g);

  const ss=mkEl('div');ss.id='snap-shadow';gw.appendChild(ss);
  body.appendChild(gw);
}

/* ── SCATTER — full-screen, non-overlapping ── */
function buildScatter(){
  const area=document.getElementById('scatter');
  area.innerHTML='';

  const n=items.length;
  const order=[...Array(n).keys()].sort(()=>Math.random()-.5);
  const placed=[]; // [{x,y,w,h}] obstacles for overlap checking

  order.forEach((itemIdx)=>{
    const item=items[itemIdx];
    const[vw,vh]=dimOf(item);
    const iW=vw*CELL*SS,iH=vh*CELL*SS;

    // Decide rotation first, then keep the rotated bounding box fully on-screen
    const sign=Math.random()>.5?1:-1;
    const rot=sign*(6+Math.random()*11);
    const rad=Math.abs(rot)*Math.PI/180;
    const ovx=(iW*Math.cos(rad)+iH*Math.sin(rad)-iW)/2;
    const ovy=(iW*Math.sin(rad)+iH*Math.cos(rad)-iH)/2;
    const m=8;
    const minX=m+ovx, maxX=W-iW-ovx-m;
    const minY=m+ovy, maxY=H-iH-ovy-m;

    let bestX=minX,bestY=minY,bestScore=Infinity;
    for(let attempt=0;attempt<80;attempt++){
      const x=minX+Math.random()*Math.max(0,maxX-minX);
      const y=minY+Math.random()*Math.max(0,maxY-minY);
      let score=0;
      for(const p of placed){
        const ox=Math.max(0,Math.min(x+iW,p.x+p.w+6)-Math.max(x,p.x-6));
        const oy=Math.max(0,Math.min(y+iH,p.y+p.h+6)-Math.max(y,p.y-6));
        score+=ox*oy;
      }
      if(score<bestScore){bestScore=score;bestX=x;bestY=y;if(score===0)break;}
    }

    const x=clamp(bestX,minX,Math.max(minX,maxX));
    const y=clamp(bestY,minY,Math.max(minY,maxY));
    placed.push({x,y,w:iW,h:iH});
    item.sx=x;item.sy=y;item.srot=rot;

    const d=mkEl('div','si');
    d.dataset.id=item.id;
    d.style.cssText=`left:${x}px;top:${y}px;width:${iW}px;height:${iH}px;transform:rotate(${rot}deg);pointer-events:auto;`;
    injectArt(d,item,iW,iH);
    d.addEventListener('mousedown',siMD);
    d.addEventListener('touchstart',siTS,{passive:false});
    item.el=d;
    area.appendChild(d);
  });
}

/* ── FILLED CELL FEEDBACK ── */
function syncFilledCells(){
  document.querySelectorAll('.gc').forEach(c=>{
    const r=+c.dataset.r,col=+c.dataset.c;
    const occupied=grid[r]&&grid[r][col]!==null;
    c.classList.toggle('filled',occupied);
  });
}

/* ── PLACED LAYER (global overlay above scatter) ── */
function rebuildPlaced(freshId=null){
  const layer=document.getElementById('global-placed');
  if(!layer)return;
  layer.innerHTML='';
  items.filter(i=>i.placed).forEach(item=>{
    const[vw,vh]=dimOf(item);
    const pW=vw*CELL,pH=vh*CELL;
    const d=mkEl('div','pi'+(item.id===freshId?' fresh':''));
    d.style.cssText=`position:absolute;left:${gridOffX+item.col*CELL}px;top:${gridOffY+item.row*CELL}px;width:${pW}px;height:${pH}px;pointer-events:auto;`;
    injectArt(d,item,pW,pH);
    d.dataset.id=item.id;
    d.addEventListener('mousedown',piMD);
    d.addEventListener('touchstart',piTS,{passive:false});
    layer.appendChild(d);
  });
}

/* ── DRAG SCATTER ── */
function siMD(e){e.preventDefault();fromScatter(+e.currentTarget.dataset.id,e.clientX,e.clientY);window.addEventListener('mousemove',onMM);window.addEventListener('mouseup',onMU);}
function siTS(e){e.preventDefault();fromScatter(+e.currentTarget.dataset.id,e.touches[0].clientX,e.touches[0].clientY);window.addEventListener('touchmove',onTM,{passive:false});window.addEventListener('touchend',onTE);}
function fromScatter(id,x,y){
  const item=items.find(i=>i.id===id);
  if(!item||item.placed)return;
  dragItem=item;
  const[vw,vh]=dimOf(item);
  dox=vw*CELL/2;doy=vh*CELL/2;
  dragItem.el.classList.add('drag');
  showGhost(x,y,item.srot);
}

/* ── DRAG PLACED ── */
function piMD(e){e.preventDefault();e.stopPropagation();fromPlaced(+e.currentTarget.dataset.id,e.clientX,e.clientY);window.addEventListener('mousemove',onMM);window.addEventListener('mouseup',onMU);}
function piTS(e){e.preventDefault();e.stopPropagation();fromPlaced(+e.currentTarget.dataset.id,e.touches[0].clientX,e.touches[0].clientY);window.addEventListener('touchmove',onTM,{passive:false});window.addEventListener('touchend',onTE);}
function fromPlaced(id,x,y){
  const item=items.find(i=>i.id===id);
  if(!item)return;
  item.cells.forEach(([r,c])=>{grid[item.row+r][item.col+c]=null;});
  item.placed=false;
  rebuildPlaced();syncFilledCells();updateProg();
  dragItem=item;
  const[vw,vh]=dimOf(item);
  dox=vw*CELL/2;doy=vh*CELL/2;
  dragItem.el.style.display='block';
  dragItem.el.classList.add('drag');
  showGhost(x,y,0);
}

/* ── GHOST with rotation animation ── */
function showGhost(x,y,startRot){
  const[vw,vh]=dimOf(dragItem);
  const gW=vw*CELL,gH=vh*CELL;
  injectArt(ghost,dragItem,gW,gH);
  ghost.style.cssText=`position:fixed;pointer-events:none;z-index:9000;
    width:${gW}px;height:${gH}px;display:block;
    transform-origin:center center;
    filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));
    opacity:.93;transition:none;
    transform:rotate(${startRot}deg) scale(1.0);
    left:${x-dox}px;top:${y-doy}px;`;
  // Trigger reflow then animate rotation to 0
  ghost.offsetHeight;
  ghost.style.transition='transform .22s cubic-bezier(.175,.885,.32,1.275)';
  ghost.style.transform='rotate(0deg) scale(1.04)';
}

/* ── MOVE / DROP ── */
function onMM(e){move(e.clientX,e.clientY);}
function onTM(e){e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY);}
function onMU(e){window.removeEventListener('mousemove',onMM);window.removeEventListener('mouseup',onMU);drop(e.clientX,e.clientY);}
function onTE(e){window.removeEventListener('touchmove',onTM);window.removeEventListener('touchend',onTE);drop(e.changedTouches[0].clientX,e.changedTouches[0].clientY);}

function move(x,y){
  if(!dragItem)return;
  // Ghost follows cursor freely (no magnetic snap)
  ghost.style.left=(x-dox)+'px';
  ghost.style.top=(y-doy)+'px';
  const{row,col,overGrid}=snapCell(x,y);
  const ok=overGrid&&canPlace(dragItem,row,col);
  highlight(overGrid,row,col,ok);
}

function snapCell(x,y){
  const g=document.getElementById('grid');
  if(!g)return{row:-99,col:-99,overGrid:false};
  const r=g.getBoundingClientRect();
  const maxC=Math.max(...dragItem.cells.map(([,c])=>c));
  const maxR=Math.max(...dragItem.cells.map(([rr])=>rr));
  const rawC=(x-dox-r.left)/CELL;
  const rawR=(y-doy-r.top)/CELL;
  const col=clamp(Math.round(rawC),0,lvl.cols-1-maxC);
  const row=clamp(Math.round(rawR),0,lvl.rows-1-maxR);
  // overGrid: cursor itself is inside grid bounds (not ghost overlap)
  const overGrid=x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
  return{row,col,overGrid};
}

function canPlace(item,row,col){
  for(const[r,c]of item.cells){
    const gr=row+r,gc=col+c;
    if(gr<0||gr>=lvl.rows||gc<0||gc>=lvl.cols)return false;
    if(grid[gr][gc]!==null)return false;
  }
  return true;
}

function highlight(overGrid,row,col,ok){
  document.querySelectorAll('.gc').forEach(c=>c.classList.remove('ok','no'));
  const sh=document.getElementById('snap-shadow');
  if(sh)sh.style.opacity='0'; // no spreading rectangle — highlight only the exact snap cells
  if(!overGrid||!dragItem)return;
  dragItem.cells.forEach(([r,c])=>{
    const gr=row+r,gc=col+c;
    if(gr>=0&&gr<lvl.rows&&gc>=0&&gc<lvl.cols){
      const cell=document.querySelector(`.gc[data-r="${gr}"][data-c="${gc}"]`);
      if(cell)cell.classList.add(ok?'ok':'no');
    }
  });
}

function drop(x,y){
  document.querySelectorAll('.gc').forEach(c=>c.classList.remove('ok','no'));
  const sh=document.getElementById('snap-shadow');if(sh)sh.style.opacity='0';
  ghost.style.display='none';
  if(!dragItem)return;
  const{row,col,overGrid}=snapCell(x,y);
  if(overGrid){
    if(canPlace(dragItem,row,col)){
      // Valid grid placement
      dragItem.cells.forEach(([r,c])=>{grid[row+r][col+c]=dragItem.id;});
      dragItem.placed=true;dragItem.row=row;dragItem.col=col;
      dragItem.el.style.display='none';dragItem.el.classList.remove('drag');
      rebuildPlaced(dragItem.id);syncFilledCells();updateProg();playPlop();checkWin();
    }else{
      // Grid occupied — bounce back to original scatter position
      dragItem.el.classList.remove('drag');
      dragItem.el.style.display='block';
      dragItem.el.style.left=dragItem.sx+'px';
      dragItem.el.style.top=dragItem.sy+'px';
      dragItem.el.style.transform=`rotate(${dragItem.srot}deg)`;
    }
  }else{
    // Free placement anywhere off-grid
    const scr=document.getElementById('scr').getBoundingClientRect();
    const[vw,vh]=dimOf(dragItem);
    const nx=clamp(x-dox-scr.left,4,W-vw*CELL*SS-4);
    const ny=clamp(y-doy-scr.top,4,H-vh*CELL*SS-4);
    // dropped off-grid → let it land with a casual rotation again (like the scatter)
    const rot=(Math.random()>.5?1:-1)*(6+Math.random()*11);
    dragItem.sx=nx;dragItem.sy=ny;dragItem.srot=rot;
    dragItem.el.classList.remove('drag');
    dragItem.el.style.display='block';
    dragItem.el.style.left=nx+'px';
    dragItem.el.style.top=ny+'px';
    dragItem.el.style.transform=`rotate(${rot}deg)`;
  }
  dragItem=null;
}

/* ── PROGRESS / WIN ── */
function updateProg(){const p=items.filter(i=>i.placed).length;document.getElementById('h-pr').textContent=`${p}/${items.length}`;}
function checkWin(){
  if(!items.every(i=>i.placed))return;
  setTimeout(()=>{
    playFanfare();doConfetti();
    document.getElementById('w-em').textContent=lvl.winEmoji;
    document.getElementById('w-ti').textContent=lvl.winTitle;
    document.getElementById('w-de').textContent=lvl.winDesc;
    const ni=(curIdx+1)%LEVELS.length;
    document.getElementById('w-btn').textContent=ni===0?'🔄 Baştan Oyna':`Level ${ni+1} →`;
    document.getElementById('win').classList.add('show');
    document.getElementById('w-btn').onclick=()=>{
      document.getElementById('win').classList.remove('show');
      initLevel(ni);
    };
  },500);
}
function showIntro(){
  document.getElementById('i-em').textContent=lvl.emoji;
  document.getElementById('i-ti').textContent=lvl.title;
  document.getElementById('i-su').textContent=lvl.sub;
  const ov=document.getElementById('intro');
  ov.classList.add('show');
  const dismiss=()=>{ov.classList.remove('show');ov.removeEventListener('click',dismiss);};
  ov.addEventListener('click',dismiss);
  setTimeout(dismiss,2200);
}
function doConfetti(){
  const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f1c','#06d6a0','#ff9ff3'];
  for(let i=0;i<80;i++) setTimeout(()=>{
    const p=document.createElement('div');p.className='cf';
    const sz=7+Math.random()*9;
    p.style.cssText=`left:${Math.random()*100}vw;top:-20px;width:${sz}px;height:${sz}px;
      background:${cols[~~(Math.random()*cols.length)]};
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${1.8+Math.random()*2.2}s;animation-delay:${Math.random()*.4}s;`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),5000);
  },i*30);
}
function playPlop(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(400,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(660,ctx.currentTime+.1);g.gain.setValueAtTime(.13,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.28);o.start();o.stop(ctx.currentTime+.3);}catch(_){}}
function playFanfare(){try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[[0,523],[.1,659],[.2,784],[.32,1047],[.44,1319]].forEach(([t,f])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=f;g.gain.setValueAtTime(.14,ctx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.3);o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.34);});}catch(_){}}

document.getElementById('skip-btn').onclick=()=>{
  document.getElementById('win').classList.remove('show');
  initLevel((curIdx+1)%LEVELS.length);
};
initLevel(0);
</script>
