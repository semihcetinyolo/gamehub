<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#263d33">
  <title>Word Train — Ray Çiz</title>
  <link rel="stylesheet" href="../core/theme.css">
  <link rel="stylesheet" href="../core/train.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wt-app wt-game v4" id="app">
    <header class="wt-hud v4-hud">
      <button class="wt-icon-button" id="levelsBtn" type="button" aria-label="Bölümler" title="Bölümler">
        <svg class="wt-icon" aria-hidden="true"><use href="../assets/icons.svg#levels"></use></svg>
      </button>
      <div class="wt-hud__level">
        <span id="levelNum">Bölüm 1</span>
        <small id="levelTitle"></small>
      </div>
      <div class="wt-hud__progress" id="progress" role="status" aria-label="İlerleme"><b id="foundNum">0</b>/<span id="totalNum">0</span></div>
      <button class="wt-icon-button" id="soundBtn" type="button" aria-label="Sesi kapat" title="Sesi kapat" aria-pressed="false">
        <svg class="wt-icon" aria-hidden="true"><use id="soundIcon" href="../assets/icons.svg#sound"></use></svg>
      </button>
      <button class="wt-icon-button" id="adminBtn" type="button" aria-label="Yönetim" title="Yönetim">
        <svg class="wt-icon" aria-hidden="true"><use href="../assets/icons.svg#admin"></use></svg>
      </button>
    </header>

    <div class="wt-playfield v4-playfield">
      <section class="v4-train" id="train" aria-label="Tren"></section>

      <div class="wt-clue-popover v4-clue" id="clueCard" role="note" aria-live="polite" hidden>
        <p class="wt-clue-popover__title">İpucu</p>
        <p class="wt-clue-popover__text" id="clue"></p>
        <button class="wt-icon-button wt-clue-popover__close" id="clueClose" type="button" aria-label="İpucunu kapat">
          <svg class="wt-icon" aria-hidden="true"><use href="../assets/icons.svg#close"></use></svg>
        </button>
      </div>

      <p class="v4-status" id="status" role="status" aria-live="polite"></p>

      <div class="v4-panel" id="boardWrap">
        <div class="v4-board" id="board" role="group" aria-label="Harf istasyonları">
          <svg class="wt-hex-path wt-hex-path--hint" id="hintRail" aria-hidden="true">
            <path class="wt-hex-path__bed"></path><path class="wt-hex-path__line"></path>
          </svg>
          <svg class="wt-hex-path" id="playerRail" aria-hidden="true">
            <path class="wt-hex-path__bed"></path><path class="wt-hex-path__line"></path>
          </svg>
          <svg class="v4-fx" id="fxSvg" aria-hidden="true">
            <line id="previewLine" class="v4-preview" x1="0" y1="0" x2="0" y2="0" visibility="hidden"></line>
          </svg>
        </div>
      </div>
    </div>

    <footer class="wt-bottom-bar v4-bottom">
      <button class="wt-button v4-restart" id="restartBtn" type="button">
        <svg class="wt-icon" aria-hidden="true"><use href="../assets/icons.svg#restart"></use></svg>
        <span>Yeniden</span>
      </button>
      <button class="wt-button wt-button--primary v4-hint" id="hintBtn" type="button">
        <svg class="wt-icon" aria-hidden="true"><use href="../assets/icons.svg#hint"></use></svg>
        <span>İpucu</span>
      </button>
    </footer>
  </main>

  <div class="wt-overlay" id="levelsSheet" hidden>
    <div class="wt-sheet" role="dialog" aria-modal="true" aria-labelledby="levelsTitle">
      <div class="wt-sheet__handle" aria-hidden="true"></div>
      <div class="wt-sheet__header">
        <h2 id="levelsTitle">Bölümler</h2>
        <button class="wt-icon-button" id="levelsClose" type="button" aria-label="Kapat">
          <svg class="wt-icon" aria-hidden="true"><use href="../assets/icons.svg#close"></use></svg>
        </button>
      </div>
      <div class="wt-sheet__body">
        <div class="v4-level-list" id="levelList"></div>
      </div>
      <div class="wt-sheet__footer">
        <button class="wt-button v4-toggle" id="hapticsToggle" type="button" role="switch" aria-checked="true">
          <svg class="wt-icon" viewBox="0 0 24 24" aria-hidden="true"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M4 8v8M20 8v8"/></g></svg>
          <span class="v4-toggle__label">Titreşim</span>
          <span class="v4-toggle__state" id="hapticsState">Açık</span>
        </button>
      </div>
    </div>
  </div>

  <div class="v4-error" id="error" role="alert" hidden></div>

  <script type="module" src="game.js"></script>
</body>
</html>
