<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Furnish Master — Gaming Room</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--blue-0:#3568d8;--blue-1:#1d3f95;--blue-2:#16315f;--gold:#ffce4d;--gold-d:#f4a93b;--shadow:0 8px 20px rgba(10,18,46,.32);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;font-family:'Nunito',system-ui,sans-serif;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;min-height:100%;padding:14px;background:#0c1430;}

  .frame{position:relative;aspect-ratio:375/812;height:min(820px,96vh);max-width:96vw;flex:0 0 auto;
    background:linear-gradient(180deg,#3568d8 0%,#2a55bb 22%,#1d3f95 55%,#16315f 100%);
    border-radius:34px;box-shadow:0 30px 80px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.06);
    overflow:hidden;display:flex;flex-direction:column;padding:14px 14px 16px;gap:12px;}

  .hud{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;height:44px;}
  .hud-btn{width:44px;height:44px;border:none;border-radius:14px;cursor:pointer;position:relative;
    background:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.2);
    color:#fff;font-size:20px;display:grid;place-items:center;transition:transform .08s,background .15s;}
  .hud-btn:active{transform:translateY(2px);background:rgba(255,255,255,.24);}
  .hud-btn .cnt{position:absolute;top:-7px;right:-6px;min-width:22px;height:22px;padding:0 5px;background:#ef6f6f;color:#fff;
    border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:12px;box-shadow:var(--shadow);}

  .board-wrap{position:relative;width:100%;flex:1 1 auto;min-height:0;overflow:hidden;background:#9fb0c4;}
  #viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;}
  #scene{position:absolute;left:0;top:0;pointer-events:none;}

  /* bottom dock: hint + box */
  .dock{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:center;gap:24px;height:112px;padding-bottom:4px;}
  #box{position:relative;flex:0 0 auto;width:96px;height:100px;cursor:pointer;align-self:flex-end;transform-origin:center bottom;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));}
  #box .badge{position:absolute;top:-6px;right:-8px;min-width:28px;height:28px;padding:0 6px;background:var(--gold);
    color:#3b2a00;border-radius:999px;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:14px;
    box-shadow:0 3px 7px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.5);}
  #box.box-open{animation:boxOpen .5s cubic-bezier(.34,1.56,.64,1);}
  #box.box-close{animation:boxClose .46s ease forwards;}
  @keyframes boxOpen{0%{transform:scale(.4) translateY(22px);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes boxClose{0%{transform:scale(1);opacity:1;}55%{transform:scale(1.07) rotate(-2deg);}100%{transform:scale(.42) translateY(22px);opacity:0;}}
  .dock .hud-btn{width:58px;height:58px;border-radius:18px;font-size:26px;margin-bottom:18px;}

  /* items */
  .it{position:absolute;-webkit-user-drag:none;user-select:none;transition:transform .22s ease;}
  /* floating (in the air, not grabbed) = tilted 45° left; grabbing removes 'floating' -> rotates upright */
  .it.floating{cursor:grab;transform:rotate(var(--tilt,-20deg)) scale(1.3);transform-origin:center center;
    filter:drop-shadow(0 0 7px rgba(255,236,150,.95)) drop-shadow(0 0 18px rgba(255,206,80,.6)) drop-shadow(0 10px 9px rgba(40,50,30,.4));}
  .it.floating:active{cursor:grabbing;}
  .it.locked{pointer-events:none;}
  .it.pop{animation:popin .45s cubic-bezier(.34,1.56,.64,1);}
  .it.snapped{animation:snap .4s cubic-bezier(.34,1.56,.64,1);}
  .it.shake{animation:shake .32s ease-in-out;filter:drop-shadow(0 0 5px rgba(232,108,88,.75)) drop-shadow(0 8px 8px rgba(40,50,30,.32));}
  .reveal{position:absolute;pointer-events:none;animation:revealFade .4s ease forwards;}
  @keyframes revealFade{from{opacity:0;}to{opacity:1;}}
  @keyframes shake{25%{transform:translateX(-3px) rotate(-1deg);}50%{transform:translateX(3px) rotate(1deg);}75%{transform:translateX(-2px) rotate(-0.6deg);}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-12px) rotate(2deg);}}
  @keyframes popin{0%{transform:scale(.26) rotate(var(--tilt,-20deg)) translateY(20px);opacity:0;}60%{transform:scale(1.4) rotate(var(--tilt,-20deg));}100%{transform:scale(1.3) rotate(var(--tilt,-20deg));opacity:1;}}
  @keyframes snap{0%{transform:scale(1.1);}100%{transform:scale(1);}}
  .wsp{position:absolute;pointer-events:none;z-index:99999;line-height:1;transform:translate(-50%,-50%);
    text-shadow:0 0 6px rgba(255,221,120,.9);animation:wsp .9s ease-out forwards;}
  @keyframes wsp{0%{opacity:0;transform:translate(-50%,-50%) scale(0);}25%{opacity:1;}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.25) rotate(55deg);}}
  .spark{position:absolute;z-index:60;pointer-events:none;font-size:18px;animation:spk .7s ease-out forwards;}
  @keyframes spk{from{transform:translate(-50%,-50%) scale(.2);opacity:1;}to{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0;}}
  .confetti{position:absolute;top:-14px;width:10px;height:15px;border-radius:2px;z-index:55;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:.9;}}

  .overlay{position:absolute;inset:0;background:rgba(6,12,34,.72);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:24px;}
  .overlay.show{display:flex;}
  .ov-card{width:84%;max-width:300px;text-align:center;background:linear-gradient(180deg,#264fb0,#1a356f);
    border:2px solid rgba(255,255,255,.18);border-radius:22px;padding:22px 20px;box-shadow:0 16px 40px rgba(0,0,0,.5);}
  .ov-emoji{font-size:48px;} .ov-title{font-size:23px;font-weight:900;color:#fff;margin:4px 0 8px;font-family:'Baloo 2';}
  .ov-sub{font-size:13.5px;color:#c5d0f0;margin-bottom:6px;line-height:1.45;}
  .ov-btn{display:block;width:100%;margin-top:10px;border:none;cursor:pointer;padding:13px;border-radius:14px;
    font-size:15px;font-weight:800;font-family:'Baloo 2';color:#5a3b00;
    background:linear-gradient(180deg,var(--gold),var(--gold-d));box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #b9781f;transition:transform .08s;}
  .ov-btn:active{transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 2px 0 #b9781f;}
  .ov-btn.ghost{color:#e7edff;background:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 0 rgba(0,0,0,.28);}
  .ov-btn.ghost:active{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 0 rgba(0,0,0,.28);}

  .toast{position:absolute;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(8,16,40,.9);color:#fff;
    font-weight:800;font-size:13px;padding:9px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.16);
    z-index:90;opacity:0;transition:.25s;white-space:nowrap;}
  .toast.show{opacity:1;bottom:138px;}
</style>
</head>
<body>
  <div class="frame" id="screen">
    <div class="hud">
      <button class="hud-btn" id="settingsBtn" title="Settings">⚙️</button>
    </div>

    <div class="board-wrap">
      <div id="viewport"><div id="world"><img id="scene" alt="scene"/></div></div>
    </div>

    <div class="dock">
      <button class="hud-btn" id="hintBtn" title="Hint">💡<span class="cnt">3</span></button>
      <div id="box"></div>
    </div>

    <div class="overlay" id="settingsOv"><div class="ov-card">
      <div class="ov-emoji">⚙️</div><div class="ov-title">Settings</div>
      <button class="ov-btn ghost" id="restartBtn">↺ Restart level</button>
      <button class="ov-btn ghost" id="closeSettingsBtn">Close</button>
    </div></div>

    <div class="overlay" id="winOv"><div class="ov-card">
      <div class="ov-emoji">🎮</div><div class="ov-title">Room Complete!</div>
      <div class="ov-sub">Every box unpacked — the gaming room is fully set up. 💙</div>
      <button class="ov-btn ghost" id="replayBtn">↺ Play Again</button>
    </div></div>

    <div class="toast" id="toast"></div>
  </div>

<script src="engine.js?v=12"></script>
<script>
const $=s=>document.querySelector(s);
const viewport=$('#viewport'), worldEl=$('#world'), boxEl=$('#box'), sceneImg=$('#scene');
let BASE='';   // level system removed
let LEVEL=null, groups=[], gi=0, spawnCount=0;
let world=makeWorld(viewport, worldEl, {minZoom:1, maxZoom:3, hMargin:0.03});  // fit the room to 94% width (3% side margins); can't shrink below fit
const STAGE_F=[[.5,.74],[.33,.68],[.67,.68],[.4,.82],[.6,.82],[.26,.76],[.74,.76]];

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1500);}

// Level system removed — the game ships without levels (empty shell).
async function boot(){ /* no level to load */ }

function startLevel(){
  if(!LEVEL) return;   // no level loaded (level system removed)
  stopAllShimmer();
  [...worldEl.querySelectorAll('.it,.wsp,.reveal')].forEach(e=>e.remove());
  groups = LEVEL.groups.map(g=>({id:g.id, items:g.items.map(it=>({...it, spawned:false, placed:false}))}));
  gi=0; spawnCount=0;
  openBoxForGroup(0, true);
}

/* ---- box (one per group) ---- */
function setBoxFace(open){ boxEl.innerHTML=boxSVG(open)+`<div class="badge" id="boxBadge">0</div>`; }
function curGroup(){ return groups[gi]; }
function openBoxForGroup(i, instant){
  gi=i; setBoxFace(true); boxEl.classList.remove('box-close');
  if(!instant){ boxEl.classList.add('box-open'); setTimeout(()=>boxEl.classList.remove('box-open'),520); }
  updateBadge();
}
function closeBoxThenNext(){
  boxEl.classList.remove('tappable'); setBoxFace(false); boxEl.classList.add('box-close');
  setTimeout(()=>{
    boxEl.classList.remove('box-close');
    if(gi+1 < groups.length){ openBoxForGroup(gi+1); }
    else { win(); }
  }, 500);
}
function updateBadge(){ const g=curGroup(); if(!g)return; const left=g.items.filter(q=>!q.spawned).length;
  const b=$('#boxBadge'); if(b)b.textContent=left;
  boxEl.classList.toggle('tappable', left>0); }

boxEl.addEventListener('click',()=>popNext());
function popNext(){
  const g=curGroup(); if(!g) return;
  const it=g.items.find(q=>!q.spawned); if(!it) return;
  it.spawned=true;
  const sf=STAGE_F[spawnCount%STAGE_F.length]; spawnCount++;
  // drop the item where the player is currently looking: spread it across the
  // VISIBLE viewport (works zoomed in or out), not at a fixed canvas spot.
  const vr=viewport.getBoundingClientRect();
  const tl=world.screenToWorld(vr.left, vr.top), brc=world.screenToWorld(vr.right, vr.bottom);
  const fx=sf[0], fy=0.30+(sf[1]-0.68)*3.0;            // sf -> spread within the current view
  const slot=[ tl.x + fx*(brc.x-tl.x), tl.y + fy*(brc.y-tl.y) ];
  const f=it.f;
  const el=document.createElement('img'); el.className='it floating pop draggable'; el.src=BASE+f.src;
  el.dataset.key=it.key; el.draggable=false;
  el.style.width=f.w+'px'; el.style.height=f.h+'px'; el.style.zIndex=100000;
  el.style.setProperty('--tilt', ((Math.random()<0.5?-1:1)*(10+Math.random()*20)).toFixed(1)+'deg');  // float tilt: ±10–30°
  const bp=boxWorldPoint();
  el.style.left=(bp.x-f.w/2)+'px'; el.style.top=(bp.y-f.h/2)+'px';
  worldEl.appendChild(el);
  requestAnimationFrame(()=>{ el.style.transition='left .5s cubic-bezier(.34,1.4,.5,1),top .5s cubic-bezier(.34,1.4,.5,1)';
    el.style.left=(slot[0]-f.w/2)+'px'; el.style.top=(slot[1]-f.h/2)+'px';
    setTimeout(()=>{ el.style.transition=''; el.classList.remove('pop'); },520); });
  it._cur={x:slot[0], y:slot[1]};
  attachDrag(el,it); startShimmer(it);
  updateBadge();
}
function boxWorldPoint(){ const br=boxEl.getBoundingClientRect(); return world.screenToWorld(br.left+br.width/2, br.top+br.height*0.4); }

/* ---- drag / snap / reveal ---- */
function tolFor(it){ return Math.max(320, 0.75*Math.max(it.f.w, it.f.h)); }   // forgiving snap: drop near the home, no need for a 1:1 placement
function attachDrag(el,it){
  el.addEventListener('pointerdown',e=>{
    if(it.placed) return; e.stopPropagation();
    el.classList.remove('floating'); el.style.zIndex=100001; try{el.setPointerCapture(e.pointerId);}catch(_){}
    const start=world.screenToWorld(e.clientX,e.clientY);
    const ox=start.x-it._cur.x, oy=start.y-it._cur.y;
    const f=it.f;
    const mv=ev=>{ if(world.suppressed) return; const p=world.screenToWorld(ev.clientX,ev.clientY);
      it._cur.x=p.x-ox; it._cur.y=p.y-oy; el.style.left=(it._cur.x-f.w/2)+'px'; el.style.top=(it._cur.y-f.h/2)+'px'; };
    const up=()=>{ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up);
      if(Math.hypot(it._cur.x-it.cx, it._cur.y-it.cy) < tolFor(it)) snap(el,it);
      else { el.classList.remove('floating'); el.classList.add('shake');
        setTimeout(()=>{ el.classList.remove('shake'); if(!it.placed){ el.classList.add('floating'); startShimmer(it); } },330); } };
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  });
}
function placeImg(L, cls){ const img=document.createElement('img'); img.className=cls; img.src=BASE+L.src;
  img.style.left=L.left+'px'; img.style.top=L.top+'px'; img.style.width=L.w+'px'; img.style.height=L.h+'px'; img.style.zIndex=L.z;
  img.draggable=false; worldEl.appendChild(img); return img; }
function snap(el,it){
  const f=it.f; stopShimmer(it); it.placed=true; it._cur={x:it.cx,y:it.cy};
  // shadow s sits behind f (added first, lower z); foreground m over (higher z)
  if(it.s) placeImg(it.s,'reveal');
  el.classList.remove('floating');
  el.style.transition='left .22s cubic-bezier(.34,1.4,.5,1),top .22s cubic-bezier(.34,1.4,.5,1)';
  el.style.left=f.left+'px'; el.style.top=f.top+'px';
  setTimeout(()=>{ el.style.transition=''; el.classList.add('locked','snapped'); el.style.zIndex=f.z;
    if(it.m) placeImg(it.m,'reveal');
    setTimeout(()=>el.classList.remove('snapped'),420); },220);
  sparkleAtWorld(it.cx,it.cy);
  if(curGroup().items.every(q=>q.placed)) setTimeout(closeBoxThenNext, 360);
}

/* ---- shimmer / fx ---- */
const shimmers=new Map();
function worldSparkle(x,y){ const g=['✨','✦','✧']; const s=document.createElement('div'); s.className='wsp';
  s.textContent=g[Math.floor(Math.random()*g.length)]; s.style.left=x+'px'; s.style.top=y+'px';
  s.style.fontSize=(16+Math.random()*16)+'px'; s.style.color='#ffd98c';
  const a=Math.random()*6.283, d=10+Math.random()*22; s.style.setProperty('--dx',Math.cos(a)*d+'px'); s.style.setProperty('--dy',(Math.sin(a)*d-8)+'px');
  worldEl.appendChild(s); setTimeout(()=>s.remove(),1100); }
function startShimmer(it){ if(shimmers.has(it.key))return;
  const id=setInterval(()=>{ const el=worldEl.querySelector(`.it[data-key="${it.key}"]`);
    if(it.placed||!el){ stopShimmer(it); return; }
    if(Math.random()<0.7) worldSparkle(it._cur.x+(Math.random()-0.5)*it.f.w*0.8, it._cur.y+(Math.random()-0.5)*it.f.h*0.8);
  },520); shimmers.set(it.key,id); }
function stopShimmer(it){ const id=shimmers.get(it.key); if(id){clearInterval(id); shimmers.delete(it.key);} }
function stopAllShimmer(){ shimmers.forEach(id=>clearInterval(id)); shimmers.clear(); }
function sparkleAtWorld(x,y){ const r=viewport.getBoundingClientRect();
  const sx=r.left + (x*world.S) + worldPan().x, sy=r.top + (y*world.S) + worldPan().y; sparkle(sx,sy); }
function worldPan(){ const m=new DOMMatrixReadOnly(getComputedStyle(worldEl).transform); return {x:m.m41,y:m.m42}; }
function sparkle(px,py){const sc=$('#screen');const sr=sc.getBoundingClientRect();const x=px-sr.left,y=py-sr.top;
  const em=['✨','💫','⭐'];for(let i=0;i<8;i++){const s=document.createElement('div');s.className='spark';s.textContent=em[i%3];
  s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*6.28,d=28+Math.random()*40;
  s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',(Math.sin(a)*d-8)+'px');
  sc.appendChild(s);setTimeout(()=>s.remove(),720);}}
function confetti(){const c=['#3568d8','#ffce4d','#e76f51','#5bbf6a','#9b8cff','#f4a261'];
  for(let i=0;i<90;i++){const e=document.createElement('div');e.className='confetti';e.style.left=Math.random()*100+'%';
    e.style.background=c[i%c.length];e.style.animationDuration=(1.7+Math.random()*1.7)+'s';e.style.animationDelay=(Math.random()*.5)+'s';
    $('#screen').appendChild(e);setTimeout(()=>e.remove(),3800);}}
function win(){ boxEl.style.display='none'; confetti(); setTimeout(()=>$('#winOv').classList.add('show'),700); }

/* ---- controls ---- */
$('#hintBtn').onclick=()=>{ const c=$('#hintBtn .cnt'); let n=+c.textContent; if(n<=0)return;
  const g=curGroup(); if(!g)return;
  let it=g.items.find(q=>q.spawned&&!q.placed) || g.items.find(q=>!q.spawned);
  if(!it)return; c.textContent=--n;
  if(!it.spawned){ popNext(); it=g.items.find(q=>q.key===it.key); }
  setTimeout(()=>{const el=worldEl.querySelector(`.it[data-key="${it.key}"]`); if(el)snap(el,it);}, it.spawned?60:560); };
$('#settingsBtn').onclick=()=>$('#settingsOv').classList.add('show');
$('#closeSettingsBtn').onclick=()=>$('#settingsOv').classList.remove('show');
$('#settingsOv').addEventListener('click',e=>{ if(e.target.id==='settingsOv') $('#settingsOv').classList.remove('show'); });
$('#restartBtn').onclick=()=>{ $('#settingsOv').classList.remove('show'); boxEl.style.display=''; startLevel(); world.reset(); };
$('#replayBtn').onclick=()=>{ $('#winOv').classList.remove('show'); boxEl.style.display=''; startLevel(); world.reset(); };

boot();
</script>
</body>
</html>
