<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Hidden Triple Match — Garden</title>
<link rel="stylesheet" href="styles.css?v=16" />
</head>
<body>
  <div class="frame" id="frame">

    <!-- ===== HUD ===== -->
    <div class="hud">
      <div class="hud-btns">
        <button class="hud-btn" id="revealBtn" title="Reveal all (3s)">👁</button>
        <button class="hud-btn" id="hintBtn" title="Hint">💡</button>
        <button class="hud-btn" id="refreshBtn" title="Restart">⟳</button>
        <button class="hud-btn" id="nextBtn" title="Next level">⏭</button>
      </div>
    </div>

    <!-- ===== BOARD ===== -->
    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board">
        <img class="bg" id="bg" alt="" draggable="false" /><!-- src set per level by game.js -->
        <!-- item layers injected here -->
      </div>
      <div class="drag-hint" id="dragHint">⇆ drag · pinch / scroll to zoom</div>
    </div>

    <!-- ===== TRAY ===== -->
    <div class="tray-row">
      <div class="progress" id="progress">
        <span class="prog-num" id="progNum">0</span><span class="prog-den" id="progDen">/10</span>
      </div>
      <div class="tray" id="tray">
        <!-- 6 slots injected here -->
      </div>
    </div>

    <!-- ===== OVERLAYS ===== -->
    <div class="overlay" id="overlay">
      <div class="overlay-card" id="overlayCard">
        <div class="overlay-emoji" id="ovEmoji">🎉</div>
        <div class="overlay-title" id="ovTitle">You Win!</div>
        <div class="overlay-sub" id="ovSub">All matches found.</div>
        <button class="overlay-btn" id="ovBtn">Play Again</button>
      </div>
    </div>

    <!-- ===== REWARDED AD (simulated) ===== -->
    <div class="ad-overlay" id="adOverlay">
      <div class="ad-card">
        <div class="ad-badge">REWARDED&nbsp;AD</div>
        <div class="ad-screen">▶</div>
        <div class="ad-timer" id="adTimer">Reward in 3s</div>
        <div class="ad-note">Watch to unlock a +1 slot</div>
      </div>
    </div>

    <!-- fly / fx layer -->
    <div class="fx-layer" id="fxLayer"></div>
  </div>

  <script src="game.js?v=16"></script>
</body>
</html>
