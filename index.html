<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Hub</title>
  <style>
    :root {
      --bg: #0f1117;
      --sidebar-bg: #161922;
      --border: #262b38;
      --text: #e6e8ee;
      --text-dim: #8b91a1;
      --accent: #5b8cff;
      --accent-soft: rgba(91, 140, 255, 0.15);
      --sidebar-w: 280px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: margin-left 0.25s ease, transform 0.25s ease;
    }
    /* Collapsed on desktop: slide out and let the stage reclaim the space */
    body.nav-closed .sidebar { margin-left: calc(-1 * var(--sidebar-w)); }

    .sidebar-header {
      padding: 20px 20px 14px 64px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .sidebar-header p {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    .game-list {
      list-style: none;
      margin: 0;
      padding: 8px;
      overflow-y: auto;
      flex: 1;
    }

    .game-list li button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 11px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.12s ease;
    }
    .game-list li button:hover { background: rgba(255,255,255,0.05); }
    .game-list li button.active {
      background: var(--accent-soft);
      color: #fff;
      font-weight: 600;
    }
    .game-list li button.active .dot { background: var(--accent); }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
    }

    /* Main stage */
    .stage {
      flex: 1;
      position: relative;
      background: #000;
    }

    .stage iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      background: var(--bg);
      gap: 10px;
      text-align: center;
      padding: 20px;
    }
    .placeholder svg { opacity: 0.4; }
    .placeholder p { margin: 0; font-size: 15px; }

    .stage-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 0;
      pointer-events: none;
    }

    /* Sidebar footer / upload button */
    .sidebar-footer {
      padding: 10px 12px 14px;
      border-top: 1px solid var(--border);
    }
    .upload-btn {
      width: 100%;
      padding: 11px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.12s ease;
    }
    .upload-btn:hover { filter: brightness(1.1); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--sidebar-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .modal-close {
      background: transparent; border: none; color: var(--text-dim);
      font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 6px;
    }
    .modal-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .modal-body { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .field > span { color: var(--text-dim); }
    .field select, .field input[type="text"] {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 9px 11px; font-size: 14px;
    }
    .field input[type="file"] {
      font-size: 12px; color: var(--text-dim);
    }
    .pickers { display: flex; gap: 16px; font-size: 13px; }
    .pick { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .hint {
      margin: -4px 0 0; font-size: 12px; color: var(--accent);
      background: var(--accent-soft); padding: 8px 10px; border-radius: 8px;
    }
    .picked { margin: 0; font-size: 12px; color: var(--text-dim); }
    .msg { margin: 0; font-size: 13px; min-height: 18px; white-space: pre-wrap; }
    .msg.ok { color: #5fd08a; }
    .msg.err { color: #ff7676; }
    .modal-foot {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 14px 18px; border-top: 1px solid var(--border);
    }
    .btn-primary, .btn-secondary {
      padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #fff; border: none; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }

    /* Uploaded-levels manager (delete) */
    .lvl-manage { border-top: 1px solid var(--border); padding-top: 14px; }
    .lvl-list {
      display: flex; flex-direction: column; gap: 4px;
      max-height: 190px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 8px; padding: 6px;
      background: rgba(0,0,0,0.18);
    }
    .lvl-row {
      display: flex; align-items: center; gap: 9px;
      padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    .lvl-row:hover { background: rgba(255,255,255,0.05); }
    .lvl-row input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .lvl-row .lvl-name { flex: 1; }
    .lvl-row .lvl-ts { font-size: 11px; color: var(--muted, #8b949e); }
    .lvl-empty { color: var(--muted, #8b949e); font-size: 13px; margin: 2px; }
    .btn-danger {
      margin-top: 10px; padding: 9px 16px; border-radius: 8px; border: none;
      background: #da3633; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-danger:hover { background: #f85149; }
    .btn-danger:disabled { opacity: 0.45; cursor: default; }

    /* Sidebar toggle button (always visible, fixed top-left) */
    .nav-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 60;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(22, 25, 34, 0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 19px;
      line-height: 1;
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }
    .nav-toggle:hover { background: rgba(40, 46, 60, 0.95); }
    .nav-toggle .ico-close { display: none; }
    body:not(.nav-closed) .nav-toggle .ico-open { display: none; }
    body:not(.nav-closed) .nav-toggle .ico-close { display: inline; }

    /* Dim backdrop behind the drawer (mobile only) */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    /* On phones the sidebar becomes an overlay drawer so the game
       always fills the screen; toggle slides it in/out. */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 40;
        width: min(82vw, 320px);
        margin-left: 0;
        box-shadow: 2px 0 24px rgba(0, 0, 0, 0.55);
      }
      body.nav-closed .sidebar {
        margin-left: 0;
        transform: translateX(-100%);
      }
      body:not(.nav-closed) .backdrop {
        opacity: 1;
        pointer-events: auto;
      }
    }
  </style>
</head>
<body>
  <button class="nav-toggle" id="navToggle" aria-label="Oyun listesini aç/kapat">
    <span class="ico-open">☰</span>
    <span class="ico-close">✕</span>
  </button>
  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>🎮 Game Hub</h1>
        <p>Soldan bir oyun seçin</p>
      </div>
      <ul class="game-list" id="gameList"></ul>
      <div class="sidebar-footer">
        <button id="uploadBtn" class="upload-btn">⬆️ Level Yükle</button>
      </div>
    </aside>

    <main class="stage">
      <div class="placeholder" id="placeholder">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="6" width="20" height="12" rx="2"/>
          <path d="M6 12h4M8 10v4"/>
          <circle cx="16" cy="11" r="1"/>
          <circle cx="18.5" cy="13.5" r="1"/>
        </svg>
        <p>Oynamak için soldaki listeden bir oyun seçin</p>
      </div>
      <iframe id="gameFrame" title="game" style="display:none" allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope"></iframe>
    </main>
  </div>

  <!-- Level upload modal -->
  <div class="modal-overlay" id="uploadModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>Level Yükle</h2>
        <button class="modal-close" id="uploadClose" aria-label="Kapat">✕</button>
      </div>
      <div class="modal-body">
        <label class="field">
          <span>Oyun</span>
          <select id="upGame"></select>
        </label>
        <p class="hint" id="upHint"></p>
        <label class="field">
          <span>Level adı</span>
          <input id="upName" type="text" placeholder="Örn: Yeni Bahçe" />
        </label>
        <div class="field">
          <span>Dosya / Klasör</span>
          <div class="pickers">
            <label class="pick"><input type="radio" name="upMode" value="folder" checked> Klasör</label>
            <label class="pick"><input type="radio" name="upMode" value="files"> Dosya(lar)</label>
          </div>
          <input id="upFolder" type="file" webkitdirectory directory multiple />
          <input id="upFiles" type="file" multiple hidden />
          <p class="picked" id="upPicked"></p>
        </div>
        <p class="msg" id="upMsg"></p>

        <div class="field lvl-manage" id="manageWrap">
          <span>Yüklenen leveller</span>
          <div class="lvl-list" id="lvlList"><p class="lvl-empty">Yükleniyor…</p></div>
          <button class="btn-danger" id="lvlDelete" disabled>🗑 Seçili levelları sil</button>
          <p class="msg" id="delMsg"></p>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn-secondary" id="upCancel">İptal</button>
        <button class="btn-primary" id="upSubmit">Yükle</button>
      </div>
    </div>
  </div>

  <script>
    const GAMES = [
      { name: "Find The Cat",                  path: "Find The Cat/game/index.html" },
      { name: "Find The Odds",                 path: "Find The Odds/index.html" },
      { name: "Find The Strange",              path: "Find The Odds v2/game/index.html" },
      { name: "Furnish Master",                path: "Furnish Master/index.html" },
      { name: "Hidden By Word",                path: "Hidden By Word/game/index.html" },
      { name: "Hidden Pairs",                  path: "Hidden Pairs/HiddenMatch2.html" },
      { name: "Hidden Match3",                 path: "Hidden Match3/oyun/match_factory_weighted_art_v83_candy_direct_level copy/index.html" },
      { name: "Pack It Up",                    path: "Pack It Up/index.html" },
      { name: "Hidden Triple Match",           path: "Hidden Triple Match by topic/game/index.html" },
      { name: "Jigsolitaire",                  path: "Jigsolitaire/index.html" },
      { name: "Sticker",                       path: "Sticker Oh Yeah/index.html" },
    ];

    const listEl = document.getElementById("gameList");
    const frame = document.getElementById("gameFrame");
    const placeholder = document.getElementById("placeholder");

    // ---- Sidebar drawer toggle ----
    const navToggle = document.getElementById("navToggle");
    const backdrop = document.getElementById("backdrop");
    const mqMobile = window.matchMedia("(max-width: 768px)");
    function setNav(closed) { document.body.classList.toggle("nav-closed", closed); }
    navToggle.addEventListener("click", () =>
      setNav(!document.body.classList.contains("nav-closed")));
    backdrop.addEventListener("click", () => setNav(true));
    // Start closed on phones (game full-screen), open on larger screens.
    setNav(mqMobile.matches);

    function loadGame(game, btn) {
      // encode each path segment so spaces work in the iframe src
      frame.src = game.path.split("/").map(encodeURIComponent).join("/");
      frame.style.display = "block";
      placeholder.style.display = "none";
      document.querySelectorAll(".game-list button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      location.hash = encodeURIComponent(game.name);
      // On phones, close the drawer so the game fills the screen.
      if (mqMobile.matches) setNav(true);
    }

    GAMES.sort((a, b) => a.name.localeCompare(b.name, "en", { sensitivity: "base" }));

    GAMES.forEach(game => {
      const li = document.createElement("li");
      const btn = document.createElement("button");
      btn.innerHTML = '<span class="dot"></span><span></span>';
      btn.querySelector("span:last-child").textContent = game.name;
      btn.addEventListener("click", () => loadGame(game, btn));
      li.appendChild(btn);
      listEl.appendChild(li);
    });

    // ---- Level upload modal ----
    const modal = document.getElementById("uploadModal");
    const upGame = document.getElementById("upGame");
    const upHint = document.getElementById("upHint");
    const upName = document.getElementById("upName");
    const upFolder = document.getElementById("upFolder");
    const upFiles = document.getElementById("upFiles");
    const upPicked = document.getElementById("upPicked");
    const upMsg = document.getElementById("upMsg");
    const upSubmit = document.getElementById("upSubmit");
    const lvlList = document.getElementById("lvlList");
    const lvlDelete = document.getElementById("lvlDelete");
    const delMsg = document.getElementById("delMsg");
    let gameSpecs = [];

    function selectedLevelIds() {
      return [...lvlList.querySelectorAll("input:checked")].map(c => c.value);
    }
    function refreshDeleteBtn() {
      const n = selectedLevelIds().length;
      lvlDelete.disabled = n === 0;
      lvlDelete.textContent = n ? `🗑 ${n} level'ı sil` : "🗑 Seçili levelları sil";
    }
    async function loadLevels(game) {
      delMsg.textContent = ""; delMsg.className = "msg";
      lvlList.innerHTML = '<p class="lvl-empty">Yükleniyor…</p>';
      lvlDelete.disabled = true;
      try {
        const r = await fetch("api/levels?game=" + encodeURIComponent(game));
        const data = await r.json();
        const levels = (data && data.levels) || [];
        if (!levels.length) {
          lvlList.innerHTML = '<p class="lvl-empty">Bu oyun için yüklenmiş level yok. (Yalnızca buradan eklenen levelları silebilirsin.)</p>';
          return;
        }
        lvlList.innerHTML = levels.map(l => {
          const ts = (l.ts || "").replace("T", " ");
          return `<label class="lvl-row"><input type="checkbox" value="${l.id}">` +
                 `<span class="lvl-name">${l.name}</span>` +
                 `<span class="lvl-ts">${ts}</span></label>`;
        }).join("");
        lvlList.querySelectorAll("input").forEach(c =>
          c.addEventListener("change", refreshDeleteBtn));
      } catch (e) {
        lvlList.innerHTML = '<p class="lvl-empty">Level listesi alınamadı.</p>';
      }
      refreshDeleteBtn();
    }
    lvlDelete.addEventListener("click", async () => {
      const ids = selectedLevelIds();
      if (!ids.length) return;
      if (!confirm(`${ids.length} level kalıcı olarak silinecek. Emin misin?`)) return;
      lvlDelete.disabled = true;
      delMsg.className = "msg"; delMsg.textContent = "Siliniyor…";
      try {
        const r = await fetch("api/levels/delete", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ game: upGame.value, ids })
        });
        const data = await r.json();
        delMsg.className = "msg " + (data.ok ? "ok" : "err");
        delMsg.textContent = (data.ok ? "✓ " : "✗ ") + (data.message || "");
        await loadLevels(upGame.value);
      } catch (e) {
        delMsg.className = "msg err"; delMsg.textContent = "Hata: " + e.message;
      }
    });

    function currentMode() {
      return document.querySelector('input[name="upMode"]:checked').value;
    }
    function syncPicker() {
      const folder = currentMode() === "folder";
      upFolder.hidden = !folder;
      upFiles.hidden = folder;
      upPicked.textContent = "";
    }
    function updateHint() {
      const spec = gameSpecs.find(g => g.name === upGame.value);
      upHint.textContent = spec ? spec.hint : "";
      // pick a sensible default mode for the game
      const folderRadio = document.querySelector('input[name="upMode"][value="folder"]');
      const filesRadio = document.querySelector('input[name="upMode"][value="files"]');
      if (spec && spec.accepts.includes("folder")) folderRadio.checked = true;
      else filesRadio.checked = true;
      syncPicker();
      if (upGame.value) loadLevels(upGame.value);
    }

    async function openModal() {
      upMsg.textContent = ""; upMsg.className = "msg"; upName.value = "";
      upFolder.value = ""; upFiles.value = ""; upPicked.textContent = "";
      try {
        if (!gameSpecs.length) {
          const r = await fetch("api/games");
          gameSpecs = await r.json();
          upGame.innerHTML = gameSpecs.map(g => `<option>${g.name}</option>`).join("");
        }
        document.getElementById("manageWrap").hidden = false;
        updateHint();
        modal.hidden = false;
      } catch (e) {
        modal.hidden = false;
        upGame.innerHTML = "";
        document.getElementById("manageWrap").hidden = true;
        upMsg.className = "msg err";
        upMsg.textContent = "Yükleme servisi çalışmıyor. Bu özellik backend (leveltool/server.py) ile sunulmayı gerektirir.";
      }
    }
    function closeModal() { modal.hidden = true; }

    document.getElementById("uploadBtn").addEventListener("click", openModal);
    document.getElementById("uploadClose").addEventListener("click", closeModal);
    document.getElementById("upCancel").addEventListener("click", closeModal);
    modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
    upGame.addEventListener("change", updateHint);
    document.querySelectorAll('input[name="upMode"]').forEach(r =>
      r.addEventListener("change", syncPicker));
    upFolder.addEventListener("change", () =>
      upPicked.textContent = `${upFolder.files.length} dosya seçildi`);
    upFiles.addEventListener("change", () =>
      upPicked.textContent = `${upFiles.files.length} dosya seçildi`);

    upSubmit.addEventListener("click", async () => {
      const input = currentMode() === "folder" ? upFolder : upFiles;
      if (!input.files.length) {
        upMsg.className = "msg err"; upMsg.textContent = "Önce dosya/klasör seçin."; return;
      }
      const fd = new FormData();
      fd.append("game", upGame.value);
      fd.append("level", upName.value.trim() || "Yeni Level");
      for (const f of input.files) fd.append("files", f, f.webkitRelativePath || f.name);
      upSubmit.disabled = true;
      upMsg.className = "msg"; upMsg.textContent = "Yükleniyor…";
      try {
        const r = await fetch("api/upload", { method: "POST", body: fd });
        const data = await r.json();
        upMsg.className = "msg " + (data.ok ? "ok" : "err");
        upMsg.textContent = (data.ok ? "✓ " : "✗ ") + (data.message || "") +
          (data.detail ? "\n\n" + data.detail : "");
        if (data.ok) loadLevels(upGame.value);   // refresh the deletable list
      } catch (e) {
        upMsg.className = "msg err"; upMsg.textContent = "Hata: " + e.message;
      } finally {
        upSubmit.disabled = false;
      }
    });

    // Open game from URL hash on load (deep-linking)
    const fromHash = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (fromHash) {
      const idx = GAMES.findIndex(g => g.name === fromHash);
      if (idx >= 0) loadGame(GAMES[idx], listEl.querySelectorAll("button")[idx]);
    }
  </script>
</body>
</html>
