<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Find the Odds — Sports</title>
<script>
  // dev cache-buster so edits show up on reload
  document.write('<link rel="stylesheet" href="styles.css?t=' + Date.now() + '">');
</script>
</head>
<body>
  <div class="phone">
    <!-- HUD -->
    <header class="hud">
      <div class="hearts" id="hearts"></div>
      <div class="level-name" id="levelName"></div>
      <div class="hud-actions">
        <button class="icon-btn hint-btn" id="hintBtn" title="Hint — reveal one" aria-label="Hint">💡</button>
        <button class="icon-btn next-btn" id="nextBtn" title="Next level" aria-label="Next level">⏭</button>
        <button class="icon-btn restart" id="restart" title="Restart" aria-label="Restart">⟳</button>
        <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <!-- Play stage: pile lives here, holders pinned at the bottom -->
    <div class="stage" id="stage">
      <div class="playfield" id="playfield"></div>
      <div class="tray" id="tray"></div>
      <div class="stickers" id="stickers"></div>
      <div class="fly" id="fly"></div>

      <!-- odds found / total, pinned to the top-left of the tray -->
      <div class="odd-count" id="oddCount" title="Odd ones found">
        <span class="odd-num" id="oddNum">0/5</span>
      </div>

      <!-- Win overlay -->
      <div class="win" id="win">
        <div class="win-card">
          <div class="win-emoji">🎉</div>
          <div class="win-text">All odd ones found!</div>
          <button class="win-btn" id="playAgain">Next level →</button>
        </div>
      </div>

      <!-- Fail overlay (auto-restarts) -->
      <div class="fail" id="fail">
        <div class="fail-card">
          <div class="fail-emoji">💔</div>
          <div class="fail-text">Out of hearts!</div>
        </div>
      </div>

      <!-- Settings overlay -->
      <div id="settingsOv" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(6,12,34,.72);z-index:200;">
        <div style="background:linear-gradient(180deg,#264fb0,#1a356f);border:2px solid rgba(255,255,255,.18);border-radius:20px;padding:22px 20px;max-width:300px;width:84%;text-align:center;color:#fff;font-family:-apple-system,Segoe UI,sans-serif;box-shadow:0 16px 40px rgba(0,0,0,.5);">
          <div style="font-size:42px">⚙️</div>
          <div style="font-size:22px;font-weight:800;margin:4px 0 14px">Settings</div>
          <label style="display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;margin:6px 2px;">♾️ Sonsuz Can <input type="checkbox" id="infHealth" style="width:20px;height:20px;accent-color:#ffce4d;cursor:pointer"></label>
          <button id="settingsClose" style="margin-top:16px;width:100%;border:none;cursor:pointer;padding:12px;border-radius:13px;font-size:15px;font-weight:800;color:#5a3b00;background:linear-gradient(180deg,#ffd95e,#f4a93b);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 #b9781f;">Kapat</button>
        </div>
      </div>
    </div>
  </div>

  <script src="matter.min.js"></script>
  <script src="levels-data.js"></script>
  <script src="game.js"></script>
</body>
</html>
